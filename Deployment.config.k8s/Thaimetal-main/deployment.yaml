apiVersion: apps/v1
kind: Deployment

metadata:
  name: prime-wms-erp-core
  namespace: prime-wms
  labels:
    app: prime-wms-erp-core

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prime-wms-erp-core

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: prime-wms-erp-core

    spec:
      imagePullSecrets:
        - name: harbor-registry

      containers:
        - name: prime-wms-erp-core

          image: harbor.prime-solution.cc/prime-wms/prime-wms-erp-core:IMAGE_TAG
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 9115
              protocol: TCP

          envFrom:
            - secretRef:
                name: prime-wms-erp-core-env

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            tcpSocket:
              port: 9115
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 9115
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3